services:
  app:
    build: .
    restart: unless-stopped
    env_file: config.env
    environment:
      PORT: "3000"
      DATA_DIR: /data
    volumes:
      - runclub_data:/data
    expose:
      - "3000"
  caddy:
    image: caddy:2
    restart: unless-stopped
    env_file: config.env
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

volumes:
  runclub_data:
  caddy_data:
  caddy_config:
