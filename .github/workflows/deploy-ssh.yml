name: 部署到自己的服务器

# 需要先在仓库 Settings → Secrets and variables → Actions 中配置：
#   SSH_HOST      服务器公网 IP 或域名
#   SSH_USER      登录用户，例如 ubuntu 或 root
#   SSH_KEY       私钥全文（对应服务器 ~/.ssh/authorized_keys 中的公钥）
#   SSH_PORT      可选，默认 22
#   DEPLOY_PATH   服务器上放 compose.ghcr.yaml 和 config.env 的目录，例如 /opt/runclub
on:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  deploy:
    name: 拉取新镜像并重启
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: SSH 部署
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || '22' }}
          script_stop: true
          script: |
            cd "${{ secrets.DEPLOY_PATH }}"
            docker compose -f compose.ghcr.yaml pull app
            docker compose -f compose.ghcr.yaml up -d --remove-orphans
            docker image prune -f
